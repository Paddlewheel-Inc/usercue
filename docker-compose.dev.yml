services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usercue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usercue}
      POSTGRES_DB: usercue
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usercue -d usercue"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: bun run dev
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://usercue:${POSTGRES_PASSWORD:-usercue}@postgres:5432/usercue
      DATA_DIR: /data
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads_dev:/data
    depends_on:
      postgres:
        condition: service_healthy
      
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  postgres_dev:
  node_modules:
  uploads_dev:
