<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#050403" />
    <meta
      name="description"
      content="Collect feedback, prioritize with your team, and keep customers in the loop from one place."
    />
    <meta property="og:site_name" content="UserCue" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UserCue" />
    <meta
      property="og:description"
      content="Collect feedback, prioritize with your team, and keep customers in the loop from one place."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UserCue" />
    <meta
      name="twitter:description"
      content="Collect feedback, prioritize with your team, and keep customers in the loop from one place."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>UserCue</title>
    <script>
      try {
        if (localStorage.getItem("usercue-theme-default") !== "dark") {
          localStorage.removeItem("usercue-theme");
          localStorage.setItem("usercue-theme-default", "dark");
        }
        if (localStorage.getItem("usercue-theme") === "light") {
          delete document.documentElement.dataset.theme;
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
        document.querySelector('meta[name="theme-color"]').content =
          document.documentElement.style.colorScheme === "light" ? "#f3efe8" : "#050403";
      } catch (e) {}
    </script>
    <link rel="icon" href="/usercue.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
