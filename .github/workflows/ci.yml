name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Validate application version
        run: bun run version:check

      - name: Test release safeguards
        run: bun run test:release

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: build
        run: bun run build

      - name: docker build
        run: docker build -t usercue:ci .
