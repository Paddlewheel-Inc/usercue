name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Serialize the version check, publication, and latest promotion together.
concurrency:
  group: usercue-image-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: usercue
          POSTGRES_PASSWORD: usercue-test
          POSTGRES_DB: usercue_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U usercue -d usercue_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    env:
      IMAGE: ghcr.io/paddlewheel-inc/usercue
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo "::error::Use vX.Y.Z or vX.Y.Z-rc.N; branches and arbitrary tags are not releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Validate release source
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bun run version:check
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run test:release
      - name: Test fresh database startup and migration
        if: hashFiles('apps/server/src/db.test.ts') != ''
        env:
          TEST_DATABASE_URL: postgres://usercue:usercue-test@localhost:5432/usercue_test
        run: bun test apps/server/src/db.test.ts
      - run: bun run typecheck
      - run: bun run lint

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/paddlewheel-inc/usercue
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ARCH: ${{ matrix.arch }}
      BUILD_IMAGE: ghcr.io/paddlewheel-inc/usercue:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check for an existing immutable release
        id: existing
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ needs.validate.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          token=$(curl --fail --silent --show-error --get --user "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:paddlewheel-inc/usercue:pull' \
            https://ghcr.io/token | jq -er '.token')
          echo "::add-mask::$token"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/paddlewheel-inc/usercue/manifests/$RELEASE_TAG")
          case "$status" in
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            200)
              docker pull --platform "linux/$ARCH" "$IMAGE:$RELEASE_TAG"
              revision=$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
              version=$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
              if [[ "$revision" != "$EXPECTED_REVISION" || "$version" != "$EXPECTED_VERSION" ]]; then
                echo '::error::This version already identifies a different build. Publish a new version.'
                exit 1
              fi
              architecture=$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{.Architecture}}')
              if [[ "$architecture" != "$ARCH" ]]; then
                echo '::error::This existing release does not include both architectures. Publish a new version.'
                exit 1
              fi
              docker tag "$IMAGE:$RELEASE_TAG" "$BUILD_IMAGE"
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Registry lookup failed (HTTP $status); refusing to publish."; exit 1 ;;
          esac

      - name: Build native release image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.BUILD_IMAGE }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_REVISION=${{ needs.validate.outputs.revision }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Verify packaged application before publication
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          docker run --rm --entrypoint bun \
            -e EXPECTED_VERSION -e EXPECTED_REVISION "$BUILD_IMAGE" -e '
              const { versionRoutes } = await import("./apps/server/src/version.ts");
              const response = await versionRoutes.request("/version");
              const body = await response.json();
              if (response.status !== 200 || body.version !== process.env.EXPECTED_VERSION ||
                  body.revision !== process.env.EXPECTED_REVISION ||
                  !(await Bun.file("./apps/web/dist/index.html").exists())) process.exit(1);
            '

      - name: Upload verified platform image
        if: steps.existing.outputs.exists != 'true'
        run: docker push "$BUILD_IMAGE"
      - name: Record verified platform digest
        run: |
          mkdir -p digests
          docker image inspect "$BUILD_IMAGE" --format '{{index .RepoDigests 0}}' > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    env:
      IMAGE: ghcr.io/paddlewheel-inc/usercue
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: app-digest-*
          path: digests
          merge-multiple: true
      - name: Publish verified multi-platform version
        id: image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: python3 scripts/image-manifest.py merge "$IMAGE" "$RELEASE_TAG" digests
      - name: Promote stable latest without downgrading
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: bun scripts/promote-latest.ts
      - name: Publication summary
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo "### UserCue $RELEASE_TAG"
            echo "Image: \`$IMAGE_REFERENCE\`"
            echo 'Platforms: linux/amd64, linux/arm64. Publishing does not update deployed instances.'
          } >> "$GITHUB_STEP_SUMMARY"

  hosted-image:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request downstream image publication
        env:
          GH_TOKEN: ${{ secrets.HOSTED_IMAGE_WORKFLOW_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.HOSTED_IMAGE_REPOSITORY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IMAGE_REFERENCE: ${{ needs.publish.outputs.reference }}
        run: |
          if [[ -z "$GH_TOKEN" || ! "$TARGET_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo '::error::Configure HOSTED_IMAGE_WORKFLOW_TOKEN and HOSTED_IMAGE_REPOSITORY to enable downstream publication. The application image is already published; rerun this job after configuring them.'
            exit 1
          fi
          gh api --method POST "repos/$TARGET_REPOSITORY/actions/workflows/hosted-image.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -f ref=main -f "inputs[tag]=$RELEASE_TAG" -f "inputs[app_image]=$IMAGE_REFERENCE"
          echo 'Downstream image publication requested. Check the receiving repository for its build result.' >> "$GITHUB_STEP_SUMMARY"
