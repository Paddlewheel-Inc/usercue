services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usercue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usercue}
      POSTGRES_DB: usercue
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usercue -d usercue"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    image: ${USERCUE_IMAGE:-ghcr.io/paddlewheel-inc/usercue:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      DATABASE_URL: postgres://usercue:${POSTGRES_PASSWORD:-usercue}@postgres:5432/usercue
      DATA_DIR: /data
      PORT: ${PORT:-3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  uploads:
